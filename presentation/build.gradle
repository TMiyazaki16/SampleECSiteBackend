apply plugin: 'org.springframework.boot'

configurations {
    all {
        // Log4j2 と Logback の競合を避けるため Logback を除外
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

dependencies {
    implementation project(':application-core')
    implementation project(':infrastructure')
    implementation project(':system-common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0'

    // DB マイグレーション (起動時に db/migration 配下の未適用 SQL を自動実行)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // MySQL JDBC ドライバ
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Cloud SQL Java Connector (本番のみ使用)
    //
    // Connector/J は Unix ドメインソケットをネイティブにサポートしないため、
    // Cloud Run がマウントする /cloudsql のソケットへは Java から直接つなげない。
    // Google も Java については本 Connector の使用を案内している。
    // https://docs.cloud.google.com/sql/docs/mysql/connect-run
    //
    // 起動時に Cloud SQL Admin API を呼んで接続先を解決するため、実行サービス
    // アカウントに roles/cloudsql.client と sqladmin API の有効化が必要（インフラ側の管轄）。
    // ローカル (docker-compose) は TCP 接続のため、この依存は使われない。
    //
    // バージョンは Spring Boot の BOM に含まれないため明示する。
    runtimeOnly 'com.google.cloud.sql:mysql-socket-factory-connector-j-8:1.31.1'
}

bootRun {
    jvmArgs = ['-Dfile.encoding=UTF-8']
}
