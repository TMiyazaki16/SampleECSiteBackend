spring:
  datasource:
    # 接続情報は環境変数で受け取る。ローカル（TCP 接続）と本番（Cloud SQL Java
    # Connector 経由）で URL 形式が異なるため、yml には直書きしない。
    # これによりローカルと本番でまったく同じコンテナイメージを動かせる。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecdb}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:ecuser}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      # スキーマ・初期データの適用は Flyway に任せる。
      # 永続 DB に対して always のままにすると起動のたびにデータが消えるため never とする。
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  # 署名鍵。環境変数 JWT_SECRET での指定が必須（Base64 エンコード済み 32 バイト以上）。
  # 鍵をリポジトリに残さないため既定値は持たせていない。未設定の場合は起動時にエラーとなる。
  # 生成例: openssl rand -base64 32
  secret: ${JWT_SECRET:}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}

app:
  cors:
    # 許可オリジンをカンマ区切りで指定する（本番例: https://sample-ec-site.tmiyazaki-works.com）
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  # Cloud Run は環境変数 PORT でリッスンポートを指定する（未設定時は 8080）
  port: ${PORT:8080}
  # コンテナ外からのアクセスを受け付けるため全インターフェースで待ち受ける
  address: 0.0.0.0

logging:
  config: classpath:log4j2.xml
