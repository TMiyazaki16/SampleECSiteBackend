spring:
  datasource:
    url: jdbc:h2:mem:ecdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      # 本番環境では H2_CONSOLE_ENABLED=false を設定してコンソールを無効化すること
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  # 本番環境では必ず環境変数 JWT_SECRET（Base64 エンコード済み 32 バイト以上）で上書きすること
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbg==}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}

app:
  cors:
    # 許可オリジンをカンマ区切りで指定する（例: https://www.tmiyazaki-works.com,https://storage.googleapis.com）
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  # Cloud Run は環境変数 PORT でリッスンポートを指定する（未設定時は 8080）
  port: ${PORT:8080}
  # コンテナ外からのアクセスを受け付けるため全インターフェースで待ち受ける
  address: 0.0.0.0

logging:
  config: classpath:log4j2.xml
